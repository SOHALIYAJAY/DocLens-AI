<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI PDF Assistant</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="popup" role="application" aria-label="AI PDF Assistant">

      <!-- ============================================================
           Section 1: Header
           ============================================================ -->
      <header class="popup-header">
        <div class="header-brand">
          <div class="logo" aria-hidden="true">
            <i class="fa-solid fa-file-pdf"></i>
          </div>
          <div class="header-text">
            <h1 class="header-title">AI PDF Assistant</h1>
            <p class="header-subtitle">Smart PDF tools powered by AI</p>
          </div>
        </div>

        <button
          type="button"
          class="icon-btn settings-btn"
          id="btn-settings"
          aria-label="Open settings"
          title="Settings"
        >
          <i class="fa-solid fa-gear"></i>
        </button>
      </header>

      <!-- Scrollable main content -->
      <main class="popup-main">

        <!-- ============================================================
             Section 2: PDF Actions
             ============================================================ -->
        <section class="section" aria-labelledby="pdf-actions-title">
          <h2 class="section-title" id="pdf-actions-title">PDF Actions</h2>

          <button type="button" class="btn btn-primary btn-block" id="btn-extract-pdf" style="background-color: #10a37f; border-color: #10a37f;">
            <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
            <span>Extract Text from PDF</span>
          </button>


        </section>

        <!-- ============================================================
             Section 3: Quick Actions
             ============================================================ -->
        <section class="section" aria-labelledby="quick-actions-title">
          <h2 class="section-title" id="quick-actions-title">Quick Actions</h2>

          <div class="quick-actions-grid">
            <button type="button" class="quick-action-card" id="btn-chat-pdf">
              <span class="quick-action-icon chat">
                <i class="fa-solid fa-comments" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Chat with PDF</span>
            </button>

            <div class="quick-action-card" style="padding: 10px;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <span class="quick-action-icon summarize">
                  <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                </span>
                <span class="quick-action-label">Summarize</span>
              </div>
              <div style="display: flex; gap: 4px; width: 100%;">
                <button type="button" class="btn btn-secondary" id="btn-sum-s" style="flex: 1; padding: 4px; font-size: 11px;">S</button>
                <button type="button" class="btn btn-secondary" id="btn-sum-m" style="flex: 1; padding: 4px; font-size: 11px;">M</button>
                <button type="button" class="btn btn-secondary" id="btn-sum-l" style="flex: 1; padding: 4px; font-size: 11px;">L</button>
              </div>
            </div>

            <button type="button" class="quick-action-card" id="btn-ask-questions">
              <span class="quick-action-icon questions">
                <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Ask Questions</span>
            </button>

            <button type="button" class="quick-action-card" id="btn-bookmark-pdf">
              <span class="quick-action-icon bookmark" style="background: rgba(236, 72, 153, 0.12); color: #ec4899;">
                <i class="fa-solid fa-bookmark" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Bookmark</span>
            </button>
          </div>
        </section>

        <!-- ============================================================
             Section 3.5: Extracted Text
             ============================================================ -->
        <section class="section" aria-labelledby="extracted-text-title" style="display: none;" id="extracted-text-section">
          <div class="section-header-row" style="margin-bottom: 8px;">
            <h2 class="section-title" id="extracted-text-title" style="margin: 0;">Extracted Text</h2>
            <button type="button" class="btn-icon" id="btn-copy-extracted" title="Copy text" style="width: 24px; height: 24px; color: var(--color-text-muted);">
              <i class="fa-solid fa-copy"></i>
            </button>
          </div>
          <div id="extracted-text-area" style="width: 100%; max-height: 200px; overflow-y: auto; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px; padding: 12px; font-size: 12px; line-height: 1.6; color: var(--color-text-muted);">
            <!-- Content populated by JS -->
          </div>
        </section>

        <!-- ============================================================
             Section 3.6: AI Response
             ============================================================ -->
        <section class="section" aria-labelledby="ai-response-title" style="display: none;" id="ai-response-section">
          <h2 class="section-title" id="ai-response-title">AI Response</h2>
          
          <div id="ai-loading-indicator" style="display: none; align-items: center; gap: 8px; margin-top: 10px; color: #3b82f6;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span id="ai-loading-text">Processing...</span>
          </div>

          <div id="ai-response-container" style="display: none; margin-top: 10px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; border-radius: 4px; font-size: 13px; line-height: 1.5; color: #fff;">
            <!-- AI text goes here -->
          </div>
        </section>





      </main>

      <!-- ============================================================
           Section 6: Footer
           ============================================================ -->
      <footer class="popup-footer">
        <span class="footer-version" id="footer-version">v1.0.0</span>

        <button type="button" class="footer-link-btn" id="btn-help">
          <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
          <span>Help</span>
        </button>
      </footer>

    </div>

    <script src="popup.js"></script>
  </body>
</html>
