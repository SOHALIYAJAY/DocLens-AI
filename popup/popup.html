<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI PDF Assistant</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="popup" role="application" aria-label="AI PDF Assistant">

      <!-- Header -->
      <header class="popup-header">
        <div class="header-brand">
          <div class="logo" aria-hidden="true">
            <i class="fa-solid fa-file-pdf"></i>
          </div>
          <div class="header-text">
            <h1 class="header-title">AI PDF Assistant</h1>
            <p class="header-subtitle">Smart PDF tools powered by AI</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button
            type="button"
            class="icon-btn"
            id="btn-refresh-popup"
            aria-label="Refresh Popup & Sidepanel"
            title="Refresh"
            style="width: 28px; height: 28px;"
          >
            <i class="fa-solid fa-rotate" style="font-size: 13px;"></i>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btn-popup-all-bookmarks"
            aria-label="All Bookmarks List"
            title="All Bookmarks List"
            style="width: 28px; height: 28px; color: #ec4899;"
          >
            <i class="fa-solid fa-bookmark" style="font-size: 13px;"></i>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="btn-popup-download"
            aria-label="Download"
            title="Download"
            style="width: 28px; height: 28px; color: #3b82f6;"
          >
            <i class="fa-solid fa-download" style="font-size: 13px;"></i>
          </button>
        </div>
      </header>

      <!-- Scrollable main content -->
      <main class="popup-main">

        <!-- PDF Actions -->
        <section class="section" aria-labelledby="pdf-actions-title">
          <h2 class="section-title" id="pdf-actions-title">PDF Actions</h2>

          <button type="button" class="btn btn-primary btn-block" id="btn-extract-pdf" style="background-color: #10a37f; border-color: #10a37f;">
            <i class="fa-solid fa-file-lines" aria-hidden="true"></i>
            <span>Extract Text &amp; Images from PDF</span>
          </button>
        </section>

        <!-- Quick Actions -->
        <section class="section" aria-labelledby="quick-actions-title">
          <h2 class="section-title" id="quick-actions-title">Quick Actions</h2>

          <div class="quick-actions-grid">
            <button type="button" class="quick-action-card" id="btn-chat-pdf">
              <span class="quick-action-icon chat">
                <i class="fa-solid fa-comments" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Chat with PDF</span>
            </button>

            <button type="button" class="quick-action-card" id="btn-ask-questions">
              <span class="quick-action-icon questions">
                <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Ask Questions</span>
            </button>

            <button type="button" class="quick-action-card" id="btn-bookmark-pdf">
              <span class="quick-action-icon bookmark" style="background: rgba(236, 72, 153, 0.12); color: #ec4899;">
                <i class="fa-solid fa-bookmark" aria-hidden="true"></i>
              </span>
              <span class="quick-action-label">Bookmark</span>
            </button>
          </div>
        </section>

        <!-- Popup Add Bookmark Form -->
        <section class="section" id="popup-bookmark-section" style="display: none; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; margin-top: 10px;">
          <input type="hidden" id="popup-bookmark-edit-id" value="" />
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
            <h2 class="section-title" style="margin: 0; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--color-text);">
              <i class="fa-solid fa-bookmark" style="color: #ec4899;"></i>
              <span id="popup-bookmark-heading">Add PDF Bookmark</span>
            </h2>
            <button type="button" class="btn-icon" id="btn-close-popup-bookmark" style="width: 20px; height: 20px; color: var(--color-text-muted); background: none; border: none; cursor: pointer;">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Input 1: Page Number -->
          <div style="margin-bottom: 8px;">
            <label for="popup-bookmark-page-input" style="display: block; font-size: 11px; color: var(--color-text-muted); margin-bottom: 4px; font-weight: 600;">
              Page Number <span style="color: #ef4444;">*</span>
            </label>
            <input
              type="number"
              id="popup-bookmark-page-input"
              min="1"
              placeholder="e.g. 5"
              style="width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); font-size: 12px; box-sizing: border-box;"
              required
            />
          </div>

          <!-- Input 2: Bookmark Title -->
          <div style="margin-bottom: 12px;">
            <label for="popup-bookmark-title-input" style="display: block; font-size: 11px; color: var(--color-text-muted); margin-bottom: 4px; font-weight: 600;">
              Bookmark Title <span style="color: #ef4444;">*</span>
            </label>
            <input
              type="text"
              id="popup-bookmark-title-input"
              placeholder="e.g. Chapter 3 Summary"
              style="width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); color: var(--color-text); font-size: 12px; box-sizing: border-box;"
              required
            />
          </div>

          <div style="display: flex; gap: 8px; justify-content: flex-end;">
            <button type="button" class="btn btn-secondary" id="btn-cancel-popup-bookmark" style="padding: 4px 10px; font-size: 11px;">Cancel</button>
            <button type="button" class="btn btn-primary" id="btn-save-popup-bookmark" style="padding: 4px 12px; font-size: 11px; background: #ec4899; border-color: #ec4899; color: #fff;">Save Bookmark</button>
          </div>
        </section>

        <!-- Popup Bookmarks List Section -->
        <section class="section" id="popup-bookmarks-list-section" style="display: none; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; margin-top: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
            <h2 class="section-title" style="margin: 0; font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--color-text);">
              <i class="fa-solid fa-list-ul" style="color: #ec4899;"></i>
              <span>Saved Bookmarks</span>
            </h2>
            <button type="button" class="btn-icon" id="btn-close-popup-bookmarks-list" style="width: 20px; height: 20px; color: var(--color-text-muted); background: none; border: none; cursor: pointer;">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <ul id="popup-bookmarks-list" style="display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; max-height: 200px; overflow-y: auto;">
            <!-- Bookmarks populated by JS -->
          </ul>
        </section>

        <!-- Extracted Text -->
        <section class="section" aria-labelledby="extracted-text-title" style="display: none;" id="extracted-text-section">
          <div class="section-header-row" style="margin-bottom: 8px;">
            <h2 class="section-title" id="extracted-text-title" style="margin: 0;">Extracted Text</h2>
            <button type="button" class="btn-icon" id="btn-copy-extracted" title="Copy text" style="width: 24px; height: 24px; color: var(--color-text-muted);">
              <i class="fa-solid fa-copy"></i>
            </button>
          </div>
          <div id="extracted-text-area" style="width: 100%; max-height: 200px; overflow-y: auto; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px; padding: 12px; font-size: 12px; line-height: 1.6; color: var(--color-text-muted);">
            <!-- Content populated by JS -->
          </div>
        </section>

        <!-- Extracted Images -->
        <section class="section" aria-labelledby="extracted-images-title" style="display: none;" id="extracted-images-section">
          <div class="section-header-row" style="margin-bottom: 8px;">
            <h2 class="section-title" id="extracted-images-title" style="margin: 0;">Extracted Images &amp; Architecture</h2>
          </div>
          <div id="popup-images-gallery" style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-height: 280px; overflow-y: auto; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px; padding: 12px;">
            <!-- Images populated by JS -->
          </div>
        </section>

        <!-- AI Response -->
        <section class="section" aria-labelledby="ai-response-title" style="display: none;" id="ai-response-section">
          <h2 class="section-title" id="ai-response-title">AI Response</h2>
          
          <div id="ai-loading-indicator" style="display: none; align-items: center; gap: 8px; margin-top: 10px; color: #3b82f6;">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span id="ai-loading-text">Processing...</span>
          </div>

          <div id="ai-response-container" style="display: none; margin-top: 10px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; border-radius: 4px; font-size: 13px; line-height: 1.5; color: #fff;">
            <!-- AI text goes here -->
          </div>
        </section>

      </main>

      <!-- Footer -->
      <footer class="popup-footer">
        <span class="footer-version" id="footer-version">v1.0.0</span>

        <button type="button" class="footer-link-btn" id="btn-help">
          <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
          <span>Help</span>
        </button>
      </footer>

    </div>

    <script src="../services/bookmark-service.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
